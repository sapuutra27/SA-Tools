<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Weapon Icon Maker</title>

  <style>
    /* ===== FONT (file sudah ada di repo) ===== */
    @font-face { font-family: 'title';  src: url(beckett.ttf); }
    @font-face { font-family: 'menu';   src: url(bankgothic-regular.ttf); }
    @font-face { font-family: 'small';  src: url(BebasNeue-Regular.ttf); }

    /* ===== WARNA ===== */
    :root {
      --blue: rgb(120, 145, 190);
      --light-blue: rgb(163, 196, 239);
      --green: #8fb98f;
      --grey: #566285;
      --line: #2b3554;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: var(--blue);
      font-family: 'menu', Impact, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }

    /* ===== JUDUL ===== */
    h1 {
      font: 400 clamp(34px, 10vw, 52px)/1 'title', serif;
      color: var(--light-blue);
      margin: 22px 24px 0;
    }

    .by {
      font: 400 14px 'small', sans-serif;
      letter-spacing: 0.45em;
      color: var(--green);
      margin: 10px 24px 0;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
    }

    /* ===== KOTAK STYLE YANG BISA DIGESER ===== */
    .track {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding: 0 11%;
      scrollbar-width: none;
    }

    .track::-webkit-scrollbar { display: none; }

    .card {
      flex: 0 0 78%;
      scroll-snap-align: center;
      text-align: center;
      opacity: 0.35;
      transform: scale(0.88);
      transition: 0.4s;
    }

    .card.on {
      opacity: 1;
      transform: none;
    }

    .card b {
      display: block;
      font: 400 clamp(18px, 5.4vw, 26px) 'menu', sans-serif;
      margin-top: 14px;
      letter-spacing: 0.04em;
    }

    .img {
      position: relative;
      padding: 22px 10px 12px;
      border: 1px solid #1d2438;
      border-radius: 20px;
      background: radial-gradient(circle at 50% 40%, #10151f, #05070b);
    }

    .img img {
      display: block;
      width: 100%;
    }

    /* gambar redup di bawah (siluet) */
    .img .dim {
      filter: brightness(0.18) grayscale(1);
      opacity: 0;
    }

    /* gambar terang di atas, terbuka dari kiri ke kanan saat proses */
    .img .lit {
      position: absolute;
      left: 10px;
      right: 10px;
      top: 22px;
      clip-path: inset(0 0 0 0);
    }

    /* garis cahaya yang berjalan mengikuti progres */
    .scan {
      position: absolute;
      top: 10px;
      bottom: 10px;
      left: 10px;
      width: 2px;
      background: var(--light-blue);
      box-shadow: 0 0 14px 3px var(--blue);
      opacity: 0;
    }

    /* ===== TITIK PENANDA & PETUNJUK ===== */
    .dots {
      display: flex;
      justify-content: center;
      gap: 7px;
      margin: 16px 0 0;
    }

    .dots i {
      width: 6px;
      height: 6px;
      border-radius: 9px;
      background: #1f2740;
      transition: 0.3s;
    }

    .dots i.on {
      width: 20px;
      background: var(--blue);
    }

    .hint {
      text-align: center;
      font: 400 13px 'small', sans-serif;
      letter-spacing: 0.3em;
      color: var(--grey);
      margin: 14px 0 0;
    }

    /* ===== AREA BAWAH: KOLOM UPLOAD / STATUS PROSES (saling menimpa) ===== */
    .low {
      display: grid;
      margin: 22px 24px 0;
    }

    .low > * { grid-area: 1 / 1; }

    .upload {
      display: block;
      text-align: center;
      padding: 18px;
      border: 1px dashed var(--line);
      border-radius: 14px;
      cursor: pointer;
      font-size: 15px;
      line-height: 1.5;
    }

    .upload small {
      display: block;
      font: 400 13px 'small', sans-serif;
      letter-spacing: 0.25em;
      color: var(--green);
      margin-top: 4px;
      word-break: break-all;
    }

    .upload.nudge { animation: nudge 0.5s; }

    @keyframes nudge {
      30% { transform: translateX(-7px); }
      60% { transform: translateX(7px); }
    }

    .status {
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s 0.6s;
    }

    .status h2 {
      margin: 0;
      font: 400 clamp(20px, 6vw, 28px) 'menu', sans-serif;
      letter-spacing: 0.12em;
    }

    .status p {
      margin: 8px 0 0;
      font: 400 14px 'small', sans-serif;
      letter-spacing: 0.28em;
      color: var(--grey);
      min-height: 1.3em;
      word-break: break-all;
    }

    .status button {
      margin: 14px 8px 0;
      font: 400 17px 'menu', sans-serif;
      color: var(--blue);
      background: none;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 18px;
    }

    /* ===== TOMBOL BACK ===== */
    .back {
      align-self: flex-end;
      margin: 10px 28px 22px;
      font: 400 clamp(24px, 7vw, 34px) 'menu', sans-serif;
      color: var(--blue);
      text-decoration: none;
    }

    /* ===== KONDISI SAAT PROSES (class "busy" dipasang di body) ===== */
    .busy .upload,
    .busy .hint,
    .busy .dots,
    .busy .card:not(.sel) {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s;
    }

    .busy .track { overflow: hidden; }

    .busy .status {
      opacity: 1;
      pointer-events: auto;
    }

    .busy .dim  { opacity: 1; }
    .busy .scan { opacity: 0.9; }

    .card.sel {
      opacity: 1;
      transform: scale(1.04);
    }

    /* saat menunggu mesin Python dimuat: siluet berkedip pelan */
    .wait .dim { animation: wait 1.2s infinite alternate; }

    @keyframes wait {
      to { opacity: 0.35; }
    }
  </style>
</head>

<body>
  <h1>Weapon Icon Maker</h1>
  <div class="by">- TWENTYSEVEN -</div>

  <main>
    <!-- kotak style diisi lewat JavaScript -->
    <div class="track" id="track"></div>
    <div class="dots" id="dotsBox"></div>
    <div class="hint">SWIPE TO CHOOSE &middot; TAP TO BUILD</div>

    <div class="low">
      <!-- kolom upload zip -->
      <label class="upload" id="uploadBox">
        UPLOAD WEAPON ZIP
        <small id="fileName">.DFF + .TXD</small>
        <input id="fileInput" type="file" accept=".zip" hidden>
      </label>

      <!-- teks proses (muncul saat konversi berjalan) -->
      <div class="status">
        <h2 id="statusTitle">LOADING ENGINE</h2>
        <p id="statusInfo">&nbsp;</p>
        <div id="actions"></div>
      </div>
    </div>
  </main>

  <audio id="bgm" loop>
    <source src="Music.mp3" type="audio/mpeg">
  </audio>

  <a class="back" id="backBtn" href="index.html">BACK</a>

  <script>
    // ================================================================
    //  PENGATURAN
    // ================================================================
    const WIDTH = 512; // lebar ikon hasil (script aslinya 1024, dikecilkan agar HP tidak kehabisan memori)

    // [nama style di dff2icon, label yang ditampilkan]
    const STYLES = [
      ['abu',      'GRAY'],
      ['kartun',   'CARTOON'],
      ['bayangan', 'SHADOW'],
      ['vice',     'VICE CITY'],
      ['gta',      'GTA V'],
      ['gta6',     'GTA6'],
      ['sleek',    'SLEEK'],
      ['re',       'RE'],
      ['pixel',    'PIXEL']
    ];

    // nama tahap dari script Python -> tulisan di layar
    const STAGE_NAMES = {
      'memuat model':        'READING MODEL',
      'membaca tekstur':     'READING TEXTURE',
      'rasterisasi':         'RASTERIZING',
      'pewarnaan dan garis': 'COLORING',
      'menyimpan':           'SAVING'
    };

    // ================================================================
    //  ELEMEN HALAMAN
    // ================================================================
    const byId        = id => document.getElementById(id);
    const track       = byId('track');
    const dotsBox     = byId('dotsBox');
    const uploadBox   = byId('uploadBox');
    const fileInput   = byId('fileInput');
    const fileName    = byId('fileName');
    const statusTitle = byId('statusTitle');
    const statusInfo  = byId('statusInfo');
    const actions     = byId('actions');
    const backBtn     = byId('backBtn');

    // ================================================================
    //  MUSIK LATAR (mengikuti pengaturan Audio dan Volume di menu Options)
    // ================================================================
    (function () {
      const music = byId('bgm');
      let audioOn = true;
      let volume = 1;

      try {
        audioOn = localStorage.getItem('audioOn') !== 'Off';
        volume = parseFloat(localStorage.getItem('audioVolume'));
      } catch (e) {}

      if (!(volume >= 0 && volume <= 1)) volume = 1;
      music.volume = volume;
      if (!audioOn) return;

      // browser sering memblokir musik otomatis, jadi dicoba lagi saat layar disentuh
      const events = ['pointerdown', 'touchstart', 'keydown'];

      function stopWaiting() {
        events.forEach(name => removeEventListener(name, tryPlay));
      }

      function tryPlay() {
        music.play().then(stopWaiting).catch(() => {});
      }

      events.forEach(name => addEventListener(name, tryPlay, { passive: true }));
      tryPlay();

      // musik dijeda saat tab disembunyikan
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) music.pause();
        else music.play().catch(() => {});
      });
    })();

    // ================================================================
    //  KOTAK STYLE (digeser kiri-kanan)
    // ================================================================
    track.innerHTML = STYLES.map(style => `
      <div class="card">
        <div class="img">
          <img class="dim" src="wi_${style[0]}.png" alt="">
          <img class="lit" src="wi_${style[0]}.png" alt="">
          <i class="scan"></i>
        </div>
        <b>${style[1]}</b>
      </div>`).join('');

    dotsBox.innerHTML = STYLES.map(() => '<i></i>').join('');

    const cards = [...track.children];
    const dots  = [...dotsBox.children];

    // ================================================================
    //  STATUS
    // ================================================================
    let currentIndex   = 0;     // kotak yang sedang di tengah
    let zipData        = null;  // isi zip yang diupload user
    let zipName        = '';
    let isBusy         = false; // true selama proses berjalan
    let worker         = null;
    let shownProgress  = 0;     // progres yang tampil di layar (dihaluskan)
    let targetProgress = 0;     // progres sebenarnya dari Python (0 sampai 1)
    let resultBuffer   = null;  // isi zip hasil
    let isFinished     = false;
    let resultOk       = 0;
    let resultBad      = [];

    // cari kotak mana yang paling dekat ke tengah layar
    function updateActiveCard() {
      const box = track.getBoundingClientRect();
      const center = box.left + box.width / 2;
      let best = 0;
      let bestDistance = 1e9;

      cards.forEach((card, i) => {
        const r = card.getBoundingClientRect();
        const distance = Math.abs(r.left + r.width / 2 - center);
        if (distance < bestDistance) {
          bestDistance = distance;
          best = i;
        }
      });

      currentIndex = best;
      cards.forEach((card, i) => card.classList.toggle('on', i === best));
      dots.forEach((dot, i) => dot.classList.toggle('on', i === best));
    }

    track.addEventListener('scroll', () => {
      if (!isBusy) updateActiveCard();
    }, { passive: true });

    addEventListener('load', updateActiveCard);
    updateActiveCard();

    // ketuk kotak di samping = geser ke tengah, ketuk kotak di tengah = mulai proses
    cards.forEach((card, i) => {
      card.onclick = () => {
        if (isBusy) return;
        if (i !== currentIndex) {
          card.scrollIntoView({ inline: 'center', behavior: 'smooth', block: 'nearest' });
        } else {
          startBuild(i);
        }
      };
    });

    // ================================================================
    //  UPLOAD ZIP
    // ================================================================
    fileInput.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      zipData = await file.arrayBuffer();
      zipName = file.name;
      fileName.textContent = file.name + ' \u00b7 ' + (file.size / 1048576).toFixed(1) + ' MB';
    };

    // kolom upload bergetar kalau user menekan kotak sebelum upload zip
    function nudgeUpload() {
      uploadBox.classList.remove('nudge');
      void uploadBox.offsetWidth; // paksa animasi mengulang
      uploadBox.classList.add('nudge');
      fileName.textContent = 'UPLOAD A ZIP FIRST';
    }

    // ================================================================
    //  KODE WORKER (Python dijalankan di sini lewat Pyodide)
    //  Disimpan sebagai teks lalu dijadikan Web Worker supaya layar tidak macet.
    // ================================================================
    const WORKER_CODE = `
importScripts('https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js');

let py;

// ---------- kode Python ----------
const PY_CODE = \`
import sys, os, zipfile, json, shutil, js
sys.path.insert(0, '/')
import dff2icon as D

def post(**k):
    js.postMessage(json.dumps(k))

# siapkan folder kerja
for d in ('/work', '/out'):
    shutil.rmtree(d, ignore_errors=True)
    os.makedirs(d)

# ekstrak zip upload
with zipfile.ZipFile('/in.zip') as z:
    z.extractall('/work')

# cari semua file .dff
files = []
for r, ds, fs in os.walk('/work'):
    ds.sort()
    for f in sorted(fs):
        if f.lower().endswith('.dff'):
            files.append(os.path.join(r, f))

total = len(files)
if not total:
    raise Exception('No .dff file found in the zip')

# kirim progres ke halaman setiap nilai progres berubah
cur = {'i': 0, 'n': ''}

class P(D.Progress):
    @property
    def frac(self):
        return self.__dict__.get('_f')

    @frac.setter
    def frac(self, v):
        self.__dict__['_f'] = v
        if cur['n']:
            try:
                ov = self.overall()
            except Exception:
                return
            post(t='p', i=cur['i'], n=total, name=cur['n'], stage=self.stage, p=(cur['i'] - 1 + ov) / total)

D.PROG = P()

# proses tiap file .dff
used = set()
ok = 0
bad = []
for i, f in enumerate(files, 1):
    name = os.path.splitext(os.path.basename(f))[0]
    o = os.path.join('/out', name + '.png')
    k = 2
    while o.lower() in used:
        o = os.path.join('/out', '%s_%d.png' % (name, k))
        k += 1
    used.add(o.lower())
    cur['i'] = i
    cur['n'] = name
    try:
        D.make_icon(f, o, WIDTH, '', False, False, 208, True, 0.0, False, STYLE, False, False)
        ok += 1
    except Exception as e:
        bad.append(name)
    post(t='p', i=i, n=total, name=name, stage='menyimpan', p=i / total)

# bungkus semua PNG jadi satu zip
with zipfile.ZipFile('/out.zip', 'w', zipfile.ZIP_DEFLATED) as z:
    for f in sorted(os.listdir('/out')):
        z.write('/out/' + f, f)

post(t='sum', ok=ok, bad=bad)
\`;

// ---------- terima perintah dari halaman ----------
onmessage = async (e) => {
  const m = e.data;
  try {
    // pertama kali: muat Pyodide, numpy, scipy, dan dff2icon.py
    if (!py) {
      postMessage(JSON.stringify({ t: 'load' }));
      py = await loadPyodide();
      await py.loadPackage(['numpy', 'scipy']);
      py.FS.writeFile('/dff2icon.py', await (await fetch(m.script)).text());
    }

    py.FS.writeFile('/in.zip', new Uint8Array(m.zip));
    py.globals.set('STYLE', m.style);
    py.globals.set('WIDTH', m.width);

    await py.runPythonAsync(PY_CODE);

    const result = py.FS.readFile('/out.zip');
    postMessage({ t: 'done', buf: result.buffer }, [result.buffer]);
  } catch (err) {
    postMessage(JSON.stringify({
      t: 'err',
      msg: String(err.message || err).split('\\n').slice(-2).join(' ')
    }));
  }
};`;

    // ================================================================
    //  MULAI PROSES
    // ================================================================
    function startBuild(index) {
      if (!zipData) {
        nudgeUpload();
        return;
      }

      isBusy = true;
      isFinished = false;
      resultBuffer = null;
      shownProgress = 0;
      targetProgress = 0;

      const styleName = STYLES[index][0];

      cards[index].classList.add('sel');
      document.body.classList.add('busy', 'wait');
      backBtn.style.opacity = 0;

      statusTitle.textContent = 'LOADING ENGINE';
      statusInfo.textContent = 'FIRST RUN TAKES A WHILE';
      actions.innerHTML = '';

      // worker dibuat sekali, dipakai ulang supaya Python tidak dimuat dua kali
      if (!worker) {
        worker = new Worker(URL.createObjectURL(new Blob([WORKER_CODE])));
        worker.onmessage = onWorkerMessage;
      }

      worker.postMessage({
        zip: zipData.slice(0),
        style: styleName,
        width: WIDTH,
        script: new URL('dff2icon.py', location.href).href
      });

      requestAnimationFrame(animate);
    }

    // ================================================================
    //  TERIMA PESAN DARI WORKER
    // ================================================================
    function onWorkerMessage(e) {
      const data = e.data;

      // hasil akhir (isi zip) dikirim sebagai objek, bukan teks
      if (data && data.t === 'done') {
        resultBuffer = data.buf;
        return;
      }

      const msg = JSON.parse(data);

      if (msg.t === 'p') {
        document.body.classList.remove('wait');
        statusTitle.textContent = 'PROCESSING';
        statusInfo.textContent =
          (STAGE_NAMES[msg.stage] || '') + ' \u00b7 ' + msg.i + '/' + msg.n + ' \u00b7 ' + msg.name;
        targetProgress = Math.min(msg.p, 1);
      }

      if (msg.t === 'sum') {
        targetProgress = 1;
        isFinished = true;
        resultBad = msg.bad;
        resultOk = msg.ok;
      }

      if (msg.t === 'err') {
        showError(msg.msg);
      }
    }

    // ================================================================
    //  ANIMASI GAMBAR TERBENTUK (dijalankan tiap frame)
    // ================================================================
    function animate() {
      const card = cards.find(c => c.classList.contains('sel'));
      if (!card || !isBusy) return;

      // progres di layar mengejar progres asli pelan-pelan
      shownProgress += (targetProgress - shownProgress) * 0.07;
      const p = Math.min(shownProgress, 1);

      const lit = card.querySelector('.lit');
      const scan = card.querySelector('.scan');
      const width = card.querySelector('.img').clientWidth - 20;

      lit.style.clipPath = 'inset(0 ' + ((1 - p) * 100) + '% 0 0)';
      scan.style.transform = 'translateX(' + (p * width) + 'px)';

      if (isFinished && resultBuffer && p > 0.995) {
        showDone();
        return;
      }

      requestAnimationFrame(animate);
    }

    // ================================================================
    //  SELESAI / ERROR / ULANG
    // ================================================================
    function showDone() {
      isBusy = false;
      document.body.classList.remove('wait');
      statusTitle.textContent = 'DONE';

      let info = resultOk + ' ICON' + (resultOk == 1 ? '' : 'S');
      if (resultBad.length) info += ' \u00b7 ' + resultBad.length + ' FAILED';
      statusInfo.textContent = info;

      actions.innerHTML =
        '<button id="downloadBtn">DOWNLOAD ZIP</button>' +
        '<button onclick="resetPage()">AGAIN</button>';

      byId('downloadBtn').onclick = () => {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(new Blob([resultBuffer], { type: 'application/zip' }));
        link.download = STYLES[currentIndex][0] + '_icons.zip';
        link.click();
      };
    }

    function showError(text) {
      isBusy = false;
      document.body.classList.remove('wait');
      statusTitle.textContent = 'ERROR';
      statusInfo.textContent = text;
      actions.innerHTML = '<button onclick="resetPage()">TRY AGAIN</button>';
    }

    // kembali ke tampilan awal (kotak style + kolom upload)
    function resetPage() {
      isBusy = false;
      document.body.classList.remove('busy', 'wait');

      cards.forEach(card => {
        card.classList.remove('sel');
        card.querySelector('.lit').style.clipPath = '';
        card.querySelector('.scan').style.transform = '';
      });

      backBtn.style.opacity = 1;
      fileName.textContent = zipName || '.DFF + .TXD';
      updateActiveCard();
    }
  </script>
</body>
</html>
