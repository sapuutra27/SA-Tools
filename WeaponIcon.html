<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Weapon Icon Maker</title>

  <style>
    /* ===== FONT (semua file sudah ada di repo) ===== */
    @font-face { font-family: 'sequel'; src: url(Sequel100Black-76.ttf); }
    @font-face { font-family: 'menu';   src: url(bankgothic-regular.ttf); }
    @font-face { font-family: 'small';  src: url(BebasNeue-Regular.ttf); }

    /* ===== WARNA & UKURAN ===== */
    :root {
      --blue: rgb(120, 145, 190);
      --light-blue: rgb(163, 196, 239);
      --grey: #566285;
      --line: #2b3554;
      --cw: min(74vw, 340px);   /* lebar kotak style, kolom upload, dan kotak proses */
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: var(--blue);
      font-family: 'menu', Impact, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      overflow-y: auto;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }

    .page {
      width: 100%;
      margin: auto 0;
      padding: 18px 0;
    }

    /* ===== JUDUL (gaya Transparent Image: putih + shadow) ===== */
    h1 {
      margin: 0 12px 26px;
      text-align: center;
      font: 400 clamp(18px, 5.6vw, 34px)/1.1 'sequel', Impact, sans-serif;
      color: #fff;
      text-shadow: 0 3px 5px rgba(0, 0, 0, 0.95), 0 0 22px rgba(163, 196, 239, 0.35);
    }

    /* tulisan TwentySeven di bawah kolom upload */
    .brand {
      margin: 22px 0 0;
      text-align: center;
      font: 400 24px 'small', sans-serif;
      letter-spacing: 0.03em;
      color: #fff;
      text-shadow: 2px 2px 3px rgba(0, 0, 0, 0.95), 0 0 14px rgba(163, 196, 239, 0.3);
    }

    /* menu dan layar proses saling menimpa di tempat yang sama */
    .zone {
      display: grid;
    }

    .zone > * { grid-area: 1 / 1; }

    /* ===== MENU: KOTAK STYLE, TITIK, UPLOAD ===== */
    .menu {
      transition: opacity 0.55s;
    }

    .track {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }

    .track::-webkit-scrollbar { display: none; }

    /* ruang kosong di kiri-kanan supaya kotak pertama dan terakhir bisa tepat di tengah */
    .track::before,
    .track::after {
      content: '';
      flex: 0 0 calc((100% - var(--cw)) / 2 - 16px);
    }

    .card {
      flex: 0 0 var(--cw);
      scroll-snap-align: center;
      text-align: center;
      opacity: 0.35;
      transform: scale(0.88);
      transition: 0.4s;
    }

    .card.on {
      opacity: 1;
      transform: none;
    }

    .card b {
      display: block;
      font: 400 clamp(16px, 4.8vw, 22px) 'menu', sans-serif;
      margin-top: 12px;
      letter-spacing: 0.04em;
    }

    .img {
      padding: 22px 10px 12px;
      border: 1px solid #1d2438;
      border-radius: 20px;
      background: radial-gradient(circle at 50% 40%, #10151f, #05070b);
    }

    .img img {
      display: block;
      width: 100%;
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 7px;
      margin: 14px 0 0;
    }

    .dots i {
      width: 6px;
      height: 6px;
      border-radius: 9px;
      background: #1f2740;
      transition: 0.3s;
    }

    .dots i.on {
      width: 20px;
      background: var(--blue);
    }

    .hint {
      text-align: center;
      font: 400 12px 'small', sans-serif;
      letter-spacing: 0.3em;
      color: var(--grey);
      margin: 12px 0 0;
    }

    .upload {
      display: block;
      width: var(--cw);
      margin: 16px auto 0;
      padding: 10px 12px;
      text-align: center;
      border: 1px dashed var(--line);
      border-radius: 12px;
      cursor: pointer;
      font-size: 13px;
      line-height: 1.4;
    }

    .upload small {
      display: block;
      font: 400 12px 'small', sans-serif;
      letter-spacing: 0.22em;
      color: #8fb98f;
      margin-top: 3px;
      word-break: break-all;
    }

    .upload.nudge { animation: nudge 0.5s; }

    @keyframes nudge {
      30% { transform: translateX(-7px); }
      60% { transform: translateX(7px); }
    }

    /* ===== LAYAR PROSES (muncul di tempat kotak style tadi) ===== */
    .stage {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      align-self: start;
    }

    .frame {
      position: relative;
      width: var(--cw);
      height: calc(var(--cw) * 0.56);
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid #1d2438;
      border-radius: 20px;
      background: radial-gradient(circle at 50% 40%, #10151f, #05070b);
    }

    .frame > * {
      position: absolute;
      opacity: 0;
    }

    /* spinner di tengah kotak */
    .spin {
      top: 50%;
      left: 50%;
      width: 34px;
      height: 34px;
      margin: -17px 0 0 -17px;
      border: 3px solid rgba(163, 196, 239, 0.22);
      border-top-color: var(--light-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      transition: opacity 0.35s;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* model .dff dalam bentuk polygon */
    #wire {
      inset: 0;
      width: 100%;
      height: 100%;
      transition: opacity 0.6s 0.2s;
    }

    /* hasil ikon */
    #result {
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 8% 5%;
      transition: opacity 0.6s;
    }

    [data-phase="load"] .spin  { opacity: 1; }
    [data-phase="poly"] #wire  { opacity: 1; }
    [data-phase="done"] #result { opacity: 1; transition-delay: 0.35s; }

    #wire { transition: opacity 0.6s 0.2s; }
    [data-phase="done"] #wire { transition-delay: 0s; }

    .line {
      margin: 16px 12px 0;
      min-height: 1.2em;
      text-align: center;
      font: 400 14px 'small', sans-serif;
      letter-spacing: 0.28em;
      color: var(--grey);
      word-break: break-word;
    }

    [data-phase="done"] .line { color: var(--blue); }

    .actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      min-height: 42px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s;
    }

    [data-phase="done"] .actions,
    [data-phase="err"] .actions {
      opacity: 1;
      pointer-events: auto;
      transition-delay: 0.7s;
    }

    .actions button {
      font: 400 14px 'menu', sans-serif;
      color: var(--blue);
      background: none;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px 14px;
    }

    /* ===== PERGANTIAN MENU <-> PROSES ===== */
    .busy .menu {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.5s, visibility 0s 0.5s;
    }

    .busy .stage {
      visibility: visible;
      pointer-events: auto;
      opacity: 1;
      transition: opacity 0.5s 0.45s;
    }

    /* tombol AGAIN: layar proses fade out dulu, baru menu fade in */
    .busy.leaving .stage {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.45s;
    }

    @media (prefers-reduced-motion: reduce) {
      .spin { animation-duration: 2.4s; }
    }
  </style>
</head>

<body data-phase="idle">
  <div class="page">
    <h1>Weapon Icon Maker</h1>

    <div class="zone">
      <!-- MENU: kotak style diisi lewat JavaScript -->
      <section class="menu" id="menu">
        <div class="track" id="track"></div>
        <div class="dots" id="dotsBox"></div>
        <div class="hint">SWIPE TO CHOOSE &middot; TAP TO BUILD</div>

        <label class="upload" id="uploadBox">
          UPLOAD WEAPON ZIP
          <small id="fileName">.DFF + .TXD</small>
          <input id="fileInput" type="file" accept=".zip" hidden>
        </label>
      </section>

      <!-- LAYAR PROSES -->
      <section class="stage" id="stage">
        <div class="frame" id="frame">
          <div class="spin"></div>
          <canvas id="wire"></canvas>
          <img id="result" alt="">
        </div>
        <div class="line" id="statusLine"></div>
        <div class="actions" id="actions"></div>
      </section>
    </div>

    <div class="brand">- TwentySeven -</div>
  </div>

  <audio id="bgm" loop>
    <source src="Music.mp3" type="audio/mpeg">
  </audio>

  <!-- ================================================================
       KODE PYTHON (dijalankan di Web Worker lewat Pyodide)
       ================================================================ -->
  <script type="text/x-python" id="pyMain">
import sys, os, zipfile, json, shutil, base64, js
import numpy as np
sys.path.insert(0, '/')
import dff2icon as D

# kualitas diatur dari halaman (lebar ikon dan supersample)
D.SUPERSAMPLE = SS

def post(**k):
    js.postMessage(json.dumps(k))

# siapkan folder kerja
for d in ('/work', '/out'):
    shutil.rmtree(d, ignore_errors=True)
    os.makedirs(d)

# ekstrak zip upload
with zipfile.ZipFile('/in.zip') as z:
    z.extractall('/work')

# cari semua file .dff
files = []
for r, ds, fs in os.walk('/work'):
    ds.sort()
    for f in sorted(fs):
        if f.lower().endswith('.dff'):
            files.append(os.path.join(r, f))

total = len(files)
if not total:
    raise Exception('No .dff file found in the zip')

# kirim progres ke halaman setiap nilai progres berubah
cur = {'i': 0, 'n': ''}

class P(D.Progress):
    @property
    def frac(self):
        return self.__dict__.get('_f')

    @frac.setter
    def frac(self, v):
        self.__dict__['_f'] = v
        if cur['n']:
            try:
                ov = self.overall()
            except Exception:
                return
            post(t='p', i=cur['i'], n=total, name=cur['n'], stage=self.stage, p=(cur['i'] - 1 + ov) / total, f=ov)

D.PROG = P()

# bentuk polygon model (kerangka garis) untuk ditampilkan di layar proses
def make_poly(f):
    try:
        parts = D.load_dff(f, False)
        parts = D.drop_parts(parts, f)
        h, v, _ = D.pick_axes(parts, '')
        V = np.vstack([p['V'][:, [h, v]] for p in parts])
        offs = np.cumsum([0] + [len(p['V']) for p in parts])
        T = np.vstack([p['T'] + offs[i] for i, p in enumerate(parts)])
        key = np.round(V / 1e-4).astype(np.int64)
        _, first, inv = np.unique(key, axis=0, return_index=True, return_inverse=True)
        inv = np.asarray(inv).ravel()
        U = V[first]
        t = inv[T]
        e = np.vstack([t[:, [0, 1]], t[:, [1, 2]], t[:, [2, 0]]])
        e = e[e[:, 0] != e[:, 1]]
        e = np.unique(np.sort(e, 1), axis=0)
        if len(e) > 14000:
            e = e[np.linspace(0, len(e) - 1, 14000).astype(np.int64)]
        mn, mx = U.min(0), U.max(0)
        w = max(float(mx[0] - mn[0]), 1e-9)
        hh = max(float(mx[1] - mn[1]), 1e-9)
        x = (U[:, 0] - mn[0]) / w
        y = (mx[1] - U[:, 1]) / hh
        post(t='poly', aspect=w / hh,
             x=[round(float(a), 4) for a in x],
             y=[round(float(a), 4) for a in y],
             e=e.ravel().astype(int).tolist())
    except Exception:
        pass

# proses tiap file .dff
used = set()
ok = 0
bad = []
why = ''
sent = False
for i, f in enumerate(files, 1):
    name = os.path.splitext(os.path.basename(f))[0]
    o = os.path.join('/out', name + '.png')
    k = 2
    while o.lower() in used:
        o = os.path.join('/out', '%s_%d.png' % (name, k))
        k += 1
    used.add(o.lower())
    cur['i'] = i
    cur['n'] = ''
    make_poly(f)
    cur['n'] = name
    try:
        D.make_icon(f, o, WIDTH, '', False, False, 208, True, 0.0, False, STYLE, False, False)
        ok += 1
        if not sent:
            with open(o, 'rb') as fh:
                post(t='prev', img='data:image/png;base64,' + base64.b64encode(fh.read()).decode())
            sent = True
    except MemoryError:
        raise
    except Exception as e:
        bad.append(name)
        if not why:
            why = '%s: %s' % (name, e)
    post(t='p', i=i, n=total, name=name, stage='menyimpan', p=i / total, f=1.0)

# bungkus semua PNG jadi satu zip
with zipfile.ZipFile('/out.zip', 'w', zipfile.ZIP_DEFLATED) as z:
    for f in sorted(os.listdir('/out')):
        z.write('/out/' + f, f)

post(t='sum', ok=ok, bad=bad, why=why)
  </script>

  <script>
    // ================================================================
    //  PENGATURAN
    // ================================================================

    // Kualitas hasil. Urutan dicoba dari atas; kalau memori HP habis,
    // otomatis turun ke baris berikutnya.
    //   w  = lebar ikon (versi Termux = 1024)
    //   ss = supersample (versi Termux = 6; 3 menghemat memori sebesar 4x)
    const TIERS = [
      { w: 1024, ss: 3 },
      { w: 768,  ss: 3 },
      { w: 512,  ss: 4 }
    ];

    // [nama style di dff2icon, label yang ditampilkan]
    const STYLES = [
      ['abu',      'GRAY'],
      ['kartun',   'CARTOON'],
      ['bayangan', 'SHADOW'],
      ['vice',     'VICE CITY'],
      ['gta',      'GTA V'],
      ['gta6',     'GTA6'],
      ['sleek',    'SLEEK'],
      ['re',       'RE'],
      ['pixel',    'PIXEL']
    ];

    // ================================================================
    //  ELEMEN HALAMAN
    // ================================================================
    const byId      = id => document.getElementById(id);
    const track     = byId('track');
    const dotsBox   = byId('dotsBox');
    const uploadBox = byId('uploadBox');
    const fileInput = byId('fileInput');
    const fileName  = byId('fileName');
    const frame     = byId('frame');
    const wireCv    = byId('wire');
    const resultImg = byId('result');
    const statusLine = byId('statusLine');
    const actions   = byId('actions');
    const PY_SRC    = byId('pyMain').textContent;

    // ================================================================
    //  MUSIK LATAR (mengikuti pengaturan Audio dan Volume di menu Options)
    // ================================================================
    (function () {
      const music = byId('bgm');
      let audioOn = true;
      let volume = 1;

      try {
        audioOn = localStorage.getItem('audioOn') !== 'Off';
        volume = parseFloat(localStorage.getItem('audioVolume'));
      } catch (e) {}

      if (!(volume >= 0 && volume <= 1)) volume = 1;
      music.volume = volume;
      if (!audioOn) return;

      // browser sering memblokir musik otomatis, jadi dicoba lagi saat layar disentuh
      const events = ['pointerdown', 'touchstart', 'keydown'];

      function stopWaiting() {
        events.forEach(name => removeEventListener(name, tryPlay));
      }

      function tryPlay() {
        music.play().then(stopWaiting).catch(() => {});
      }

      events.forEach(name => addEventListener(name, tryPlay, { passive: true }));
      tryPlay();

      // musik dijeda saat tab disembunyikan
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) music.pause();
        else music.play().catch(() => {});
      });
    })();

    // ================================================================
    //  KOTAK STYLE (digeser kiri-kanan)
    // ================================================================
    track.innerHTML = STYLES.map(style => `
      <div class="card">
        <div class="img"><img src="wi_${style[0]}.png" alt=""></div>
        <b>${style[1]}</b>
      </div>`).join('');

    dotsBox.innerHTML = STYLES.map(() => '<i></i>').join('');

    const cards = [...track.querySelectorAll('.card')];
    const dots  = [...dotsBox.children];

    // ================================================================
    //  STATUS
    // ================================================================
    let currentIndex   = 0;     // kotak yang sedang di tengah
    let zipData        = null;  // isi zip yang diupload user
    let zipName        = '';
    let fileLabel      = '';
    let builtStyle     = '';
    let isBusy         = false; // true selama proses berjalan
    let resetting      = false;
    let phase          = 'idle'; // idle | load | poly | done | err
    let tier           = 0;
    let worker         = null;
    let shownProgress  = 0;     // progres yang tampil di layar (dihaluskan)
    let targetProgress = 0;     // progres sebenarnya dari Python (0 sampai 1)
    let resultBuffer   = null;  // isi zip hasil
    let prevSrc        = '';    // gambar ikon pertama (ditampilkan saat selesai)
    let isFinished     = false;
    let resultOk       = 0;
    let resultBad      = [];
    let resultWhy      = '';
    let wire           = null;  // data polygon yang sedang digambar

    function setPhase(name) {
      phase = name;
      document.body.dataset.phase = name;
    }

    function setLine(text) {
      statusLine.textContent = text;
    }

    // cari kotak mana yang paling dekat ke tengah layar
    function updateActiveCard() {
      const box = track.getBoundingClientRect();
      const center = box.left + box.width / 2;
      let best = 0;
      let bestDistance = 1e9;

      cards.forEach((card, i) => {
        const r = card.getBoundingClientRect();
        const distance = Math.abs(r.left + r.width / 2 - center);
        if (distance < bestDistance) {
          bestDistance = distance;
          best = i;
        }
      });

      currentIndex = best;
      cards.forEach((card, i) => card.classList.toggle('on', i === best));
      dots.forEach((dot, i) => dot.classList.toggle('on', i === best));
    }

    track.addEventListener('scroll', () => {
      if (!isBusy) updateActiveCard();
    }, { passive: true });

    addEventListener('load', updateActiveCard);
    addEventListener('resize', () => { if (!isBusy) updateActiveCard(); });
    updateActiveCard();

    // ketuk kotak di samping = geser ke tengah, ketuk kotak di tengah = mulai proses
    cards.forEach((card, i) => {
      card.onclick = () => {
        if (isBusy || resetting) return;
        if (i !== currentIndex) {
          card.scrollIntoView({ inline: 'center', behavior: 'smooth', block: 'nearest' });
        } else {
          startBuild(i);
        }
      };
    });

    // ================================================================
    //  UPLOAD ZIP
    // ================================================================
    fileInput.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      zipData = await file.arrayBuffer();
      zipName = file.name;
      fileLabel = file.name + ' \u00b7 ' + (file.size / 1048576).toFixed(1) + ' MB';
      fileName.textContent = fileLabel;
    };

    // kolom upload bergetar kalau user menekan kotak sebelum upload zip
    function nudgeUpload() {
      uploadBox.classList.remove('nudge');
      void uploadBox.offsetWidth; // paksa animasi mengulang
      uploadBox.classList.add('nudge');
      fileName.textContent = 'UPLOAD A ZIP FIRST';
      setTimeout(() => { fileName.textContent = fileLabel || '.DFF + .TXD'; }, 1600);
    }

    // ================================================================
    //  WORKER (Python dijalankan di sini lewat Pyodide)
    //  Fungsi ini diubah jadi teks lalu dijalankan sebagai Web Worker
    //  supaya layar tidak macet.
    // ================================================================
    function workerMain() {
      importScripts('https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js');

      let py;

      onmessage = async (e) => {
        const m = e.data;
        try {
          // pertama kali: muat Pyodide, numpy, scipy, dan dff2icon.py
          if (!py) {
            postMessage(JSON.stringify({ t: 'load' }));
            py = await loadPyodide();
            await py.loadPackage(['numpy', 'scipy']);
            py.FS.writeFile('/dff2icon.py', await (await fetch(m.script)).text());
          }

          py.FS.writeFile('/in.zip', new Uint8Array(m.zip));
          py.globals.set('STYLE', m.style);
          py.globals.set('WIDTH', m.width);
          py.globals.set('SS', m.ss);

          await py.runPythonAsync(m.code);

          const result = py.FS.readFile('/out.zip');
          postMessage({ t: 'done', buf: result.buffer }, [result.buffer]);
        } catch (err) {
          postMessage(JSON.stringify({
            t: 'err',
            msg: String(err.message || err).split('\n').slice(-2).join(' ')
          }));
        }
      };
    }

    // ================================================================
    //  MULAI PROSES
    // ================================================================
    function resetRunState() {
      shownProgress = 0;
      targetProgress = 0;
      resultBuffer = null;
      prevSrc = '';
      isFinished = false;
      resultOk = 0;
      resultBad = [];
      resultWhy = '';
      wire = null;
    }

    function startBuild(index) {
      if (!zipData) {
        nudgeUpload();
        return;
      }

      // kotak proses dibuat seukuran kotak style yang dipilih
      const box = cards[index].querySelector('.img').getBoundingClientRect();
      frame.style.width = box.width + 'px';
      frame.style.height = box.height + 'px';

      builtStyle = STYLES[index][0];
      tier = 0;
      isBusy = true;
      resetRunState();
      actions.innerHTML = '';
      resultImg.removeAttribute('src');
      setPhase('load');
      setLine('LOADING ENGINE');
      document.body.classList.add('busy');

      runJob();
      requestAnimationFrame(animate);
    }

    function runJob() {
      if (!worker) {
        worker = new Worker(URL.createObjectURL(
          new Blob(['(', workerMain.toString(), ')()'], { type: 'text/javascript' })
        ));
        worker.onmessage = onWorkerMessage;
        worker.onerror = (ev) => handleFail(ev && ev.message ? ev.message : 'worker crashed', true);
      }

      worker.postMessage({
        zip: zipData.slice(0),
        style: builtStyle,
        width: TIERS[tier].w,
        ss: TIERS[tier].ss,
        code: PY_SRC,
        script: new URL('dff2icon.py', location.href).href
      });
    }

    // kalau memori habis: ulangi dengan kualitas satu tingkat di bawahnya
    function handleFail(text, crashed) {
      if (!isBusy) return;
      const memoryLike = /memory|alloc|bounds|unreachable|RangeError|crash/i.test(text);

      if (crashed && worker) {
        worker.terminate();
        worker = null;
      }

      if (memoryLike && tier < TIERS.length - 1) {
        tier++;
        if (worker) { worker.terminate(); worker = null; }
        resetRunState();
        setPhase('load');
        setLine('RETRYING \u00b7 LOWER QUALITY');
        runJob();
        return;
      }

      showError(text);
    }

    // ================================================================
    //  TERIMA PESAN DARI WORKER
    // ================================================================
    function onWorkerMessage(e) {
      const data = e.data;

      // hasil akhir (isi zip) dikirim sebagai objek, bukan teks
      if (data && data.t === 'done') {
        resultBuffer = data.buf;
        return;
      }

      if (typeof data !== 'string') return;
      const msg = JSON.parse(data);

      if (msg.t === 'poly') {
        buildWire(msg);
        shownProgress = 0;
        targetProgress = 0;
        if (!isFinished) setPhase('poly');
      }

      if (msg.t === 'p') {
        setLine(msg.n > 1 ? 'PROCESSING ' + msg.i + '/' + msg.n : 'PROCESSING');
        targetProgress = Math.min(msg.f, 1);
      }

      if (msg.t === 'prev') {
        prevSrc = msg.img;
      }

      if (msg.t === 'sum') {
        targetProgress = 1;
        isFinished = true;
        resultBad = msg.bad;
        resultOk = msg.ok;
        resultWhy = msg.why;
      }

      if (msg.t === 'err') {
        handleFail(msg.msg, false);
      }
    }

    // ================================================================
    //  POLYGON MODEL + EFEK SAPUAN CAHAYA
    //  Garis model digambar redup, lalu menyala mengikuti pita cahaya
    //  yang bergerak dari kiri ke kanan sesuai progres.
    // ================================================================
    const wireCtx = wireCv.getContext('2d');
    const tmpCv = document.createElement('canvas');
    const tmpCtx = tmpCv.getContext('2d');

    function strokeLayer(W, H, segs, style, width, glow) {
      const c = document.createElement('canvas');
      c.width = W;
      c.height = H;
      const g = c.getContext('2d');
      g.lineCap = 'round';
      g.strokeStyle = style;
      g.lineWidth = width;
      if (glow) {
        g.shadowColor = glow.color;
        g.shadowBlur = glow.blur;
      }
      g.beginPath();
      for (let i = 0; i < segs.length; i += 4) {
        g.moveTo(segs[i], segs[i + 1]);
        g.lineTo(segs[i + 2], segs[i + 3]);
      }
      g.stroke();
      return c;
    }

    function buildWire(msg) {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const W = Math.max(2, Math.round(wireCv.clientWidth * dpr));
      const H = Math.max(2, Math.round(wireCv.clientHeight * dpr));
      wireCv.width = W;
      wireCv.height = H;
      tmpCv.width = W;
      tmpCv.height = H;

      // muat model ke tengah kotak dengan bingkai kosong di sekelilingnya
      const aspect = Math.max(0.05, Math.min(msg.aspect, 40));
      let dw = W * 0.8;
      let dh = dw / aspect;
      if (dh > H * 0.68) {
        dh = H * 0.68;
        dw = dh * aspect;
      }
      const ox = (W - dw) / 2;
      const oy = (H - dh) / 2;

      const e = msg.e;
      const segs = new Float32Array((e.length / 2) * 4);
      for (let i = 0, j = 0; i < e.length; i += 2, j += 4) {
        const a = e[i];
        const b = e[i + 1];
        segs[j]     = ox + msg.x[a] * dw;
        segs[j + 1] = oy + msg.y[a] * dh;
        segs[j + 2] = ox + msg.x[b] * dw;
        segs[j + 3] = oy + msg.y[b] * dh;
      }

      wire = {
        W, H, dpr, x0: ox, x1: ox + dw,
        dim:    strokeLayer(W, H, segs, 'rgba(120,145,190,0.38)', dpr * 0.7),
        bright: strokeLayer(W, H, segs, 'rgba(205,225,255,0.95)', dpr * 0.9,
                            { color: 'rgba(110,150,230,0.9)', blur: 6 * dpr })
      };
    }

    // p = 0..1, pita cahaya mulai dari sebelum kiri model sampai lewat kanan model
    function drawWire(p) {
      const w = wire;
      const W = w.W;
      const H = w.H;
      const dpr = w.dpr;

      const bw = (w.x1 - w.x0) * 0.2 + 10 * dpr;                 // panjang pita
      const cx = (w.x0 - bw * 0.25) + ((w.x1 - w.x0) + bw * 1.4) * p;
      const at = x => Math.min(1, Math.max(0, x / W));

      wireCtx.globalCompositeOperation = 'source-over';
      wireCtx.clearRect(0, 0, W, H);
      wireCtx.drawImage(w.dim, 0, 0);

      // garis terang hanya terlihat di belakang dan di dalam pita
      const mask = tmpCtx.createLinearGradient(0, 0, W, 0);
      mask.addColorStop(0, 'rgba(0,0,0,0.5)');
      mask.addColorStop(at(cx - bw), 'rgba(0,0,0,0.5)');
      mask.addColorStop(at(cx), 'rgba(0,0,0,1)');
      mask.addColorStop(at(cx + bw * 0.3), 'rgba(0,0,0,0)');
      mask.addColorStop(1, 'rgba(0,0,0,0)');

      tmpCtx.globalCompositeOperation = 'source-over';
      tmpCtx.clearRect(0, 0, W, H);
      tmpCtx.drawImage(w.bright, 0, 0);
      tmpCtx.globalCompositeOperation = 'destination-in';
      tmpCtx.fillStyle = mask;
      tmpCtx.fillRect(0, 0, W, H);
      wireCtx.drawImage(tmpCv, 0, 0);

      // cahaya lembut di ekor pita + garis tipis di ujung depan yang memudar di atas-bawah
      wireCtx.globalCompositeOperation = 'lighter';

      const glow = wireCtx.createLinearGradient(cx - bw, 0, cx + bw * 0.15, 0);
      glow.addColorStop(0, 'rgba(120,160,235,0)');
      glow.addColorStop(0.7, 'rgba(120,160,235,0.10)');
      glow.addColorStop(1, 'rgba(180,215,255,0.26)');
      wireCtx.fillStyle = glow;
      wireCtx.fillRect(cx - bw, 0, bw * 1.15, H);

      const edge = wireCtx.createLinearGradient(0, 0, 0, H);
      edge.addColorStop(0, 'rgba(200,225,255,0)');
      edge.addColorStop(0.5, 'rgba(220,238,255,0.9)');
      edge.addColorStop(1, 'rgba(200,225,255,0)');
      wireCtx.fillStyle = edge;
      wireCtx.fillRect(cx + bw * 0.15 - dpr * 0.5, 0, dpr, H);

      wireCtx.globalCompositeOperation = 'source-over';
    }

    // ================================================================
    //  ANIMASI (dijalankan tiap frame selama proses)
    // ================================================================
    function animate() {
      if (!isBusy) return;

      // progres di layar mengejar progres asli pelan-pelan
      shownProgress += (targetProgress - shownProgress) * 0.08;
      const p = Math.min(shownProgress, 1);

      if (wire && phase === 'poly') drawWire(p);

      if (isFinished && resultBuffer && p > 0.992) {
        showDone();
        return;
      }

      requestAnimationFrame(animate);
    }

    // ================================================================
    //  SELESAI / ERROR / ULANG
    // ================================================================
    function showDone() {
      isBusy = false;

      if (resultOk === 0) {
        showError(resultWhy || 'No icon could be made');
        return;
      }

      if (wire && phase === 'poly') drawWire(1); // pita sudah lewat, garis tinggal menyala
      if (prevSrc) resultImg.src = prevSrc;
      setPhase('done');

      let info = 'DONE \u00b7 ' + resultOk + ' ICON' + (resultOk === 1 ? '' : 'S');
      if (resultBad.length) info += ' \u00b7 ' + resultBad.length + ' FAILED';
      setLine(info);

      actions.innerHTML =
        '<button id="downloadBtn">DOWNLOAD ZIP</button>' +
        '<button onclick="resetPage()">AGAIN</button>';

      const buffer = resultBuffer;
      byId('downloadBtn').onclick = () => {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(new Blob([buffer], { type: 'application/zip' }));
        link.download = builtStyle + '_icons.zip';
        link.click();
      };
    }

    function showError(text) {
      isBusy = false;
      setPhase('err');
      setLine(text);
      actions.innerHTML = '<button onclick="resetPage()">TRY AGAIN</button>';
    }

    // kembali ke menu: layar proses fade out dulu, baru menu fade in
    function resetPage() {
      if (resetting) return;
      resetting = true;
      isBusy = false;
      document.body.classList.add('leaving');

      setTimeout(() => {
        document.body.classList.remove('busy', 'leaving');
        setPhase('idle');
        actions.innerHTML = '';
        setLine('');
        resultImg.removeAttribute('src');
        wireCtx.clearRect(0, 0, wireCv.width, wireCv.height);
        wire = null;
        resultBuffer = null;
        fileName.textContent = fileLabel || '.DFF + .TXD';
        updateActiveCard();
        resetting = false;
      }, 520);
    }
  </script>
</body>
</html>
