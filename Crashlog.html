<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a1a">
<title>Crashlog Reader</title>
<style>
@font-face{font-family:'BebasNeue';src:url('./BebasNeue-Regular.ttf') format('truetype');}
@font-face{font-family:'Sequel100Black';src:url('./Sequel100Black-76.ttf') format('truetype');}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{touch-action:pan-x pan-y;overscroll-behavior:none;}
body{margin:0;font-family:Arial,sans-serif;background:radial-gradient(120% 90% at 50% 0%,#2a1c55 0%,#0b0a1c 55%,#000 100%);color:#fff;height:100vh;height:100dvh;width:100vw;overflow:hidden;text-align:center;display:flex;justify-content:center;align-items:center;-webkit-user-select:none;user-select:none;}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(12,8,34,.35) 0%,rgba(0,0,0,.6) 100%);}
#bgVideo{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;object-fit:cover;z-index:-2;}
.menu-wrapper{transform:translateY(0);padding:0 14px;animation:rise .7s ease both;}
@keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.container{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;width:100%;position:relative;}
h1{font-size:clamp(17px,5.6vw,22px);white-space:nowrap;margin:0 0 12px;font-family:'Sequel100Black',sans-serif;letter-spacing:1px;text-shadow:0 3px 0 rgba(0,0,0,.45),0 0 26px rgba(120,150,255,.55);}
label[for="fileInput"]{margin-bottom:8px;display:block;font-size:12px;font-weight:bold;letter-spacing:.4px;text-shadow:2px 2px 6px rgba(0,0,0,.9);}
input[type="file"]{width:min(72vw,280px);padding:7px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(14,12,34,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#e5e7eb;font-size:11px;box-shadow:0 6px 18px rgba(0,0,0,.4);}
input[type="file"]::file-selector-button{margin-right:8px;padding:6px 11px;border:0;border-radius:9px;background:linear-gradient(135deg,#60a5fa,#2563eb);color:#fff;font-weight:700;font-size:12px;cursor:pointer;}
.actions{margin-top:14px;}
button{padding:8px 26px;border-radius:11px;border:0;font-weight:700;font-size:13px;letter-spacing:.6px;color:#fff;background:linear-gradient(135deg,#3b82f6,#2563eb 60%,#1d4ed8);cursor:pointer;box-shadow:0 8px 20px rgba(37,99,235,.45),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .2s ease,box-shadow .2s ease;font-family:Arial,sans-serif;}
button:hover{transform:scale(1.05);box-shadow:0 10px 26px rgba(37,99,235,.6),inset 0 1px 0 rgba(255,255,255,.3);}
button:active{transform:scale(.96);box-shadow:0 3px 8px rgba(37,99,235,.4);}
#output,#backBtn,.footer-note{opacity:0;display:none;pointer-events:none;}
#output.show,#backBtn.show,.footer-note.show{display:block;animation:fadeIn .8s forwards;pointer-events:auto;}
#backBtn.show{display:inline-block;}
#output.hide,#backBtn.hide,.footer-note.hide{animation:fadeOut .8s forwards;pointer-events:none;}
#output-wrapper{display:flex;flex-direction:column;align-items:center;position:absolute;max-height:90vh;max-height:90dvh;}
#output{background:rgba(9,8,24,.66);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.15);box-shadow:0 18px 50px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.1);padding:16px;border-radius:18px;width:90vw;max-width:600px;max-height:68vh;max-height:68dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.3) transparent;white-space:pre-wrap;text-align:left;transition:opacity .8s ease;font-size:14px;line-height:1.6;-webkit-user-select:text;user-select:text;}
#output.show{opacity:1;pointer-events:auto;display:block;}
#output details{margin:8px 0;}
#output summary{cursor:pointer;padding:3px 0;}
#backBtn{margin-top:14px;transition:opacity .8s ease;}
#backBtn.show{display:inline-block;opacity:1;pointer-events:auto;}
.footer-note{margin-top:10px;font-size:14px;color:#fff;font-family:'BebasNeue',sans-serif;letter-spacing:1px;text-align:center;transition:opacity .8s ease;text-shadow:2px 2px 5px rgba(0,0,0,.8);}
.footer-note.show{display:block;opacity:1;pointer-events:auto;}
.fadeout{animation:fadeOut .8s forwards;pointer-events:none;}
.fadein{animation:fadeIn .8s forwards;}
@keyframes fadeOut{from{opacity:1;}to{opacity:0;}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
#fileError,#uploadWarning{color:#fff;margin-top:10px;font-size:12px;display:none;text-shadow:2px 2px 6px rgba(0,0,0,.9);font-weight:bold;}
#fileError{color:#fca5a5;}
.highlight-error{color:rgb(255,36,36);font-weight:bold;}
.highlight-problem{color:rgb(255,160,36);font-weight:bold;}
.highlight-solution{color:rgb(168,255,5);font-weight:bold;}
.highlight-note{color:rgb(214,214,214);font-style:italic;}
.highlight-info{color:rgb(77,208,225);font-weight:bold;}
.highlight-warning{color:rgb(250,204,21);font-weight:bold;}
.highlight-generic{color:rgb(167,139,250);font-weight:bold;}
.spoiler{background-color:rgb(64,64,64);color:transparent;border-radius:5px;cursor:pointer;transition:color .2s ease,background-color .2s ease;padding:0 5px;}
.spoiler.revealed{color:inherit;background-color:rgba(255,255,255,.1);}
#warnScreen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:5;pointer-events:none;}
#warnScreen.show{display:flex;animation:fadeIn .6s forwards;}
#warnScreen.leave{animation:fadeOut .5s forwards;}
.warn-card{width:min(84vw,330px);padding:18px 18px 14px;border-radius:18px;background:rgba(9,8,24,.7);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(250,204,21,.35);box-shadow:0 18px 50px rgba(0,0,0,.6),0 0 24px rgba(250,204,21,.12);text-align:center;}
#warnTitle{font-family:'BebasNeue',sans-serif;font-size:22px;letter-spacing:3px;color:rgb(250,204,21);margin-bottom:8px;}
#warnText{font-size:13px;line-height:1.6;color:#f3f4f6;}
.warn-bar{height:3px;margin-top:14px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;}
.warn-bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#facc15,#fb923c);}
.credit{margin-top:16px;font-size:13px;letter-spacing:3px;color:#fff;font-family:'BebasNeue',sans-serif;text-shadow:2px 2px 5px rgba(0,0,0,.8);}
</style>
</head>
<body>
<audio id="musicAudio" loop><source src="Music.mp3" type="audio/mpeg"></audio>
<script>
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault();},{passive:false});
const musicAudio=document.getElementById("musicAudio");
function loadAndPlay(){
const savedOn=localStorage.getItem("audioOn");
const savedVolume=parseFloat(localStorage.getItem("audioVolume"));
if(!isNaN(savedVolume)){musicAudio.volume=savedVolume;}
if(savedOn==="On"){musicAudio.play().catch(()=>{});}
}
window.addEventListener("load",loadAndPlay);
document.body.addEventListener("click",()=>{
if(localStorage.getItem("audioOn")==="On"&&musicAudio.paused){musicAudio.play();}
},{once:true});
</script>
<video autoplay muted loop playsinline id="bgVideo"><source src="background1.mp4" type="video/mp4"></video>
<div class="container">
<div class="menu-wrapper">
<h1 id="title">Crashlog Reader</h1>
<div class="uploader" id="uploader">
<label for="fileInput">Upload file crashlog disini</label>
<input type="file" id="fileInput" accept=".txt">
<div id="fileError">File yang diupload tidak sesuai!</div>
<div id="uploadWarning">Harap upload file aml_crashlog.txt terlebih dahulu.</div>
</div>
<div class="actions" id="actions">
<button id="startBtn">Mulai</button>
<div class="credit">- TwentySeven -</div>
</div>
</div>
<div id="output-wrapper">
<div id="output"></div>
<div id="footerNote" class="footer-note">Documented by ARM<br>15/07/2024</div>
<button id="backBtn"></button>
</div>
</div>
<div id="warnScreen"><div class="warn-card"><div id="warnTitle"></div><div id="warnText"></div><div class="warn-bar"><span id="warnBar"></span></div></div></div>
<script>
let crashList={};
let crashLogContent="";
let currentTexts={};
function parseSpoiler(text){
return text.replace(/\|\|(.*?)\|\|/g,(match,p1)=>{return `<span class="spoiler">${p1}</span>`;});
}
document.addEventListener('click',function(e){
if(e.target.classList.contains('spoiler')){e.target.classList.toggle('revealed');}
});
function showTempMessage(el){
el.style.display='block';
el.classList.remove('fadeout');
void el.offsetWidth;
setTimeout(()=>{
el.classList.add('fadeout');
setTimeout(()=>{el.style.display='none';},3000);
},3000);
}
async function loadCrashList(){
try{
const lang=navigator.language||navigator.userLanguage||'';
let fileName=lang.startsWith('id')?'Crash_List - 2.00 ID.txt':'Crash_List - 2.00.txt';
const res=await fetch(fileName);
const text=await res.text();
parseCrashList(text);
}catch(e){console.error('Gagal load Crash_List:',e);}
}
function parseCrashList(text){
const normalized=text.replace(/\r\n/g,'\n');
const blockRegex=/(^\s*(?:Error:|Kesalahan:)[\s\S]*?)(?=^\s*(?:Error:|Kesalahan:)|\Z)/gm;
const blocks=normalized.match(blockRegex)||[];
blocks.forEach(block=>{
const lines=block.replace(/\n+$/,'').split('\n');
const codeLine=lines.find(l=>/0x[0-9A-Fa-f]+/.test(l))||'';
const codes=(codeLine.match(/0x[0-9A-Fa-f]+/g)||[]).map(c=>c.trim());
codes.forEach(code=>crashList[code]=lines);
});
}
function renderCrashLines(lines){
const out=document.getElementById('output');
const backBtn=document.getElementById('backBtn');
out.innerHTML='';
let lineIndex=0,currentTextNode=null;
let lastDetails=null;
function classifyAndBuild(line){
const container=document.createElement('div');
const m=line.match(/^[^:]+:/);
if(m){
const label=m[0];
const rest=line.slice(label.length).trim();
const labelLower=label.toLowerCase();
if(labelLower.includes('problem')||labelLower.includes('masalah')){
const details=document.createElement('details');
const summary=document.createElement('summary');
summary.textContent=label;
summary.className='highlight-problem';
details.appendChild(summary);
const content=document.createElement('div');
content.style.marginLeft="12px";
content.innerHTML=parseSpoiler(rest);
details.appendChild(content);
lastDetails=details;
lastDetails.lastContent=content;
return {container:details};
}
if(labelLower.includes('solution')||labelLower.includes('solusi')){
const solDetails=document.createElement('details');
const solSummary=document.createElement('summary');
solSummary.textContent=label;
solSummary.className='highlight-solution';
solDetails.appendChild(solSummary);
const content=document.createElement('div');
content.style.marginLeft="12px";
content.innerHTML=parseSpoiler(rest);
solDetails.appendChild(content);
solDetails.lastContent=content;
if(lastDetails){lastDetails.appendChild(solDetails);}
lastDetails=solDetails;
return {container:document.createDocumentFragment()};
}
if(labelLower.includes('error')||labelLower.includes('kesalahan')){
const spanLabel=document.createElement('span');
spanLabel.className='highlight-error';
spanLabel.textContent=label;
const spanCode=document.createElement('span');
spanCode.style.color='#ffffff';
if(rest)spanCode.textContent=" "+rest;
container.appendChild(spanLabel);
container.appendChild(spanCode);
lastDetails=null;
return {container};
}
if(labelLower.includes('fyi')||labelLower.includes('note')||labelLower.includes('catatan')){
const note=document.createElement('div');
note.style.marginLeft="12px";
note.textContent=label+" "+rest;
if(lastDetails){
lastDetails.appendChild(note);
return {container:document.createDocumentFragment()};
}else{
container.appendChild(note);
return {container};
}
}
const genDetails=document.createElement('details');
const genSummary=document.createElement('summary');
genSummary.textContent=label;
if(/warning|peringatan/.test(labelLower)){
genSummary.className='highlight-warning';
}else if(/info|informasi|about|tentang/.test(labelLower)){
genSummary.className='highlight-info';
}else{
genSummary.className='highlight-generic';
}
genDetails.appendChild(genSummary);
if(rest){
const content=document.createElement('div');
content.style.marginLeft="12px";
content.innerHTML=parseSpoiler(rest);
genDetails.appendChild(content);
genDetails.lastContent=content;
}
lastDetails=genDetails;
return {container:genDetails};
}
if(lastDetails&&line.trim()!==""){
if(lastDetails.lastContent){
lastDetails.lastContent.textContent+=" "+line.trim();
}else{
const extra=document.createElement('div');
extra.style.marginLeft="12px";
extra.textContent=line.trim();
lastDetails.appendChild(extra);
lastDetails.lastContent=extra;
}
return {container:document.createDocumentFragment()};
}
currentTextNode=document.createTextNode(line);
container.appendChild(currentTextNode);
return {container};
}
function nextLine(){
if(lineIndex>=lines.length){
document.getElementById('footerNote').classList.add('show');
backBtn.textContent=currentTexts.backBtn;
backBtn.classList.add('show');
return;
}
const raw=lines[lineIndex];
const {container}=classifyAndBuild(raw);
out.appendChild(container);
lineIndex++;
nextLine();
}
nextLine();
}
const WARN_MS=7000;
const warnTexts={
id:{title:'PERINGATAN',text:'Jangan gunakan modpack, termasuk modpack dari YouTuber mana pun. Modder tidak bertanggung jawab atas crash yang disebabkan oleh modpack. Buatlah modpack sendiri, dengan begitu kamu bisa mencari tahu penyebab crash dengan teliti.'},
en:{title:'WARNING',text:'Do not use modpacks, including modpacks from any YouTuber. Modders are not responsible for crashes caused by modpacks. Build your own modpack so you can track down the cause of a crash carefully.'}
};
function showWarning(done){
const w=document.getElementById('warnScreen');
const bar=document.getElementById('warnBar');
const t=(navigator.language||'').startsWith('en')?warnTexts.en:warnTexts.id;
document.getElementById('warnTitle').textContent=t.title;
document.getElementById('warnText').textContent=t.text;
bar.style.transition='none';
bar.style.width='0';
w.classList.remove('leave');
w.classList.add('show');
void bar.offsetWidth;
bar.style.transition='width '+WARN_MS+'ms linear';
bar.style.width='100%';
setTimeout(()=>{
w.classList.add('leave');
setTimeout(()=>{
w.classList.remove('show');
w.classList.remove('leave');
done();
},500);
},WARN_MS);
}
function setUIText(lang){
let texts={
uploadWarning:'Harap upload file aml_crashlog.txt terlebih dahulu.',
uploadLabel:'Upload file crashlog disini',
fileError:'File yang diupload tidak sesuai!',
startBtn:'Mulai',
backBtn:'Kembali',
notFound:'Tidak ditemukan kode crash yang cocok.'
};
if((lang||'').startsWith('en')){
texts={
uploadWarning:'Please upload aml_crashlog.txt first.',
uploadLabel:'Upload crashlog file here',
fileError:'The uploaded file is not valid!',
startBtn:'Start',
backBtn:'Back',
notFound:'No matching crash code found.'
};
}
currentTexts=texts;
document.querySelector("label[for='fileInput']").textContent=texts.uploadLabel;
document.getElementById('fileError').textContent=texts.fileError;
document.getElementById('uploadWarning').textContent=texts.uploadWarning;
document.getElementById('startBtn').textContent=texts.startBtn;
}
document.getElementById('fileInput').addEventListener('change',function(e){
const file=e.target.files[0];
const fileError=document.getElementById('fileError');
const uploadWarning=document.getElementById('uploadWarning');
if(file){
if(file.name!=='aml_crashlog.txt'){
showTempMessage(fileError);
crashLogContent='';
uploadWarning.style.display='none';
return;
}
fileError.style.display='none';
uploadWarning.style.display='none';
const reader=new FileReader();
reader.onload=ev=>{crashLogContent=ev.target.result;};
reader.readAsText(file);
}
});
document.getElementById('startBtn').addEventListener('click',()=>{
const out=document.getElementById('output');
const uploadWarning=document.getElementById('uploadWarning');
const footer=document.getElementById('footerNote');
const title=document.getElementById('title');
const uploader=document.getElementById('uploader');
const actions=document.getElementById('actions');
const backBtn=document.getElementById('backBtn');
const fileInput=document.getElementById('fileInput');
out.classList.remove('show');
out.innerHTML='';
footer.classList.remove('show');
backBtn.classList.remove('show');
const hasChosenFile=fileInput&&fileInput.files&&fileInput.files.length>0;
const isRightName=hasChosenFile&&fileInput.files[0].name==='aml_crashlog.txt';
const hasContent=!!crashLogContent;
if(!hasChosenFile||!isRightName||!hasContent){
showTempMessage(uploadWarning);
return;
}
title.classList.add('fadeout');
uploader.classList.add('fadeout');
actions.classList.add('fadeout');
setTimeout(()=>{
showWarning(()=>{
out.classList.add('show');
let found=false;
for(const code in crashList){
if(crashLogContent.includes(code)){
renderCrashLines(crashList[code]);
found=true;
break;
}
}
if(!found){
out.textContent=currentTexts.notFound;
footer.classList.add('show');
backBtn.textContent=currentTexts.backBtn;
setTimeout(()=>backBtn.classList.add('show'),100);
}
});
},1000);
});
document.getElementById('backBtn').addEventListener('click',()=>{
const out=document.getElementById('output');
const footer=document.getElementById('footerNote');
const title=document.getElementById('title');
const uploader=document.getElementById('uploader');
const actions=document.getElementById('actions');
const backBtn=document.getElementById('backBtn');
const fileInput=document.getElementById('fileInput');
const fileError=document.getElementById('fileError');
const uploadWarning=document.getElementById('uploadWarning');
out.classList.remove('show');
out.classList.add('hide');
backBtn.classList.remove('show');
backBtn.classList.add('hide');
footer.classList.remove('show');
footer.classList.add('hide');
setTimeout(()=>{
out.classList.remove('hide');
backBtn.classList.remove('hide');
footer.classList.remove('hide');
},800);
crashLogContent='';
if(fileInput)fileInput.value='';
if(fileError)fileError.style.display='none';
if(uploadWarning)uploadWarning.style.display='none';
setTimeout(()=>{
title.classList.remove('fadeout');
uploader.classList.remove('fadeout');
actions.classList.remove('fadeout');
title.classList.add('fadein');
uploader.classList.add('fadein');
actions.classList.add('fadein');
setTimeout(()=>{
title.classList.remove('fadein');
uploader.classList.remove('fadein');
actions.classList.remove('fadein');
},400);
},400);
});
setUIText(navigator.language||'');
loadCrashList();
</script>
<script src="crash_parser.js"></script>
<script src="crash_kb.js"></script>
<script src="crash_kb_en.js"></script>
<script src="crash_analyzer.js"></script>
</body>
</html>
